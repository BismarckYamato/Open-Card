readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "BismarckYamato", email = "adhritd@icloud.com" }
]
keywords = ["football", "soccer", "trading-cards", "opencv", "computer-vision", "flask"]
dependencies = [
    "flask>=3.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[tool.uv]
package = false
